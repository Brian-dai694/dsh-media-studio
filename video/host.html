<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频插件 · 本地协作宿主</title>
  <style>
    :root { --ink:#1d1d1f; --ink-2:#6e6e73; --line:rgba(0,0,0,.08); --canvas:#f5f5f7; --brand:#0071e3; --r:14px; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--canvas); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 20px; background:#fff; box-shadow:inset 0 -1px 0 var(--line); }
    header h1 { margin:0; font-size:16px; letter-spacing:-.02em; }
    .tag { font-size:12px; color:var(--ink-2); background:rgba(0,0,0,.05); border-radius:999px; padding:3px 10px; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; padding:16px; height:calc(100vh - 58px); }
    .stage { background:#fff; border-radius:var(--r); overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    iframe { width:100%; height:100%; border:0; display:block; }
    aside { display:flex; flex-direction:column; gap:12px; min-height:0; }
    .panel { background:#fff; border-radius:var(--r); padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    .panel h2 { margin:0 0 10px; font-size:13px; color:var(--ink-2); font-weight:600; letter-spacing:.02em; }
    button { font:inherit; border:0; border-radius:999px; padding:9px 14px; cursor:pointer; background:rgba(0,0,0,.05); color:var(--ink); transition:background 180ms cubic-bezier(.25,1,.5,1); }
    button:hover { background:rgba(0,0,0,.09); }
    button.primary { background:var(--brand); color:#fff; }
    button.primary:hover { background:#0077ed; }
    button[disabled] { cursor:not-allowed; opacity:.45; }
    .row { display:flex; flex-wrap:wrap; gap:8px; }
    input[type=text] { width:100%; padding:9px 12px; border:0; border-radius:10px; background:#f2f2f7; font:inherit; }
    input[type=text]:focus-visible { outline:2px solid var(--brand); outline-offset:2px; background:#fff; }
    .status { font-size:13px; color:var(--ink-2); }
    pre { margin:0; max-height:340px; overflow:auto; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:#f5f5f7; border-radius:10px; padding:10px; white-space:pre-wrap; word-break:break-all; }
    .note { font-size:12px; color:var(--ink-2); line-height:1.5; }
  </style>
</head>
<body>
  <header>
    <h1>视频插件 · 本地协作宿主</h1>
    <span class="tag">本地 harness · 不是 DSH runtime 工具注册</span>
  </header>
  <main>
    <div class="stage"><iframe id="editor" src="/video/" title="视频编辑器"></iframe></div>
    <aside>
      <section class="panel">
        <h2>连接</h2>
        <div class="row"><button class="primary" id="connect">连接编辑器</button><button id="reconnect">重新连接</button></div>
        <p class="status" id="status">未连接。编辑器状态仍由页面自身持有。</p>
      </section>
      <section class="panel">
        <h2>读取 / 预览</h2>
        <div class="row"><button id="read">读取工程状态</button><button id="query">查询原命令结果</button></div>
        <input type="text" id="text" value="片头字幕" aria-label="叠加文字" style="margin-top:8px">
        <div class="row" style="margin-top:8px"><button id="prepare">生成意图预览</button><button id="approve" disabled>确认执行</button></div>
      </section>
      <section class="panel">
        <h2>结果</h2>
        <pre id="output">尚未调用本地 Host 工具。</pre>
      </section>
      <section class="panel">
        <h2>边界</h2>
        <p class="note">本页只调用隔离原型的 <code>/video-relay</code> 与 <code>/video-tools</code>。媒体字节留在编辑器内，不经过中继；未注册到真实 DSH runtime，越权或未知结果一律不重放。</p>
      </section>
    </aside>
  </main>
  <script type="module" src="host.js"></script>
</body>
</html>
