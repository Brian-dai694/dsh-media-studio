<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片协作隔离原型</title><style>body{margin:0;font:14px system-ui;background:#f5f6f8;color:#182235}header{padding:12px 18px;background:#fff;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 76px)}iframe{width:100%;height:100%;border:0}aside{padding:14px;overflow:auto;border-left:1px solid #ddd}button,input,textarea{font:inherit;box-sizing:border-box;margin:5px 0;padding:8px;max-width:100%}textarea,input{width:100%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:10px;font-size:12px}.warning{color:#8a4a00}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}iframe{height:70vh}aside{border-top:1px solid #ddd}}</style></head>
<body><header><strong>图片协作隔离原型</strong> <span class="warning">本地工具模拟入口；尚未加载到真实 DSH</span><div id="status">等待编辑器加载</div></header><main><iframe id="editor" src="/editor/" title="miniPaint 中文编辑器"></iframe><aside><button id="connect">连接编辑器</button><button id="reconnect">重连通信（不重载工程）</button><button id="read">读取工程/选中层</button><p>先在左侧选中文字层，再读取状态。下方操作经过 Node 工具适配器与 HTTP 中继。</p><label>修改文字<textarea id="text" rows="3">人机协作测试</textarea></label><button id="update">修改选中文字层</button><button id="stale">用旧修订号提交（冲突测试）</button><label>原命令 ID<input id="commandId" readonly></label><button id="query">查询原命令结果</button><pre id="output">尚未读取状态</pre></aside></main><script type="module" src="/host/prototype-parent.mjs"></script></body></html>
