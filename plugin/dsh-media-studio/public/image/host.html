<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片插件 · DSH 协作宿主</title>
  <style>
    :root { --ink:#1d1d1f; --ink-2:#6e6e73; --line:rgba(0,0,0,.08); --canvas:#f5f5f7; --brand:#0071e3; --r:14px; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--canvas); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 20px; background:#fff; box-shadow:inset 0 -1px 0 var(--line); }
    header h1 { margin:0; font-size:16px; letter-spacing:-.02em; }
    .tag { font-size:12px; color:var(--ink-2); background:rgba(0,0,0,.05); border-radius:999px; padding:3px 10px; }
    main { display:grid; grid-template-columns:minmax(0,1fr); padding:12px; height:calc(100vh - 58px); }
    main > aside { display:none; }
    .stage { min-width:0; min-height:0; }
    .stage { background:#fff; border-radius:var(--r); overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    iframe { width:100%; height:100%; border:0; display:block; }
    aside { display:flex; flex-direction:column; gap:12px; min-height:0; overflow:auto; }
    .panel { background:#fff; border-radius:var(--r); padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    .panel h2 { margin:0 0 10px; font-size:13px; color:var(--ink-2); font-weight:600; letter-spacing:.02em; }
    button { font:inherit; border:0; border-radius:999px; padding:9px 14px; cursor:pointer; background:rgba(0,0,0,.05); color:var(--ink); transition:background 180ms cubic-bezier(.25,1,.5,1); }
    button:hover { background:rgba(0,0,0,.09); }
    button.primary { background:var(--brand); color:#fff; }
    button.primary:hover { background:#0077ed; }
    .row { display:flex; flex-wrap:wrap; gap:8px; }
    .status { font-size:13px; color:var(--ink-2); margin:10px 0 0; }
    pre { margin:0; max-height:320px; overflow:auto; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:#f5f5f7; border-radius:10px; padding:10px; white-space:pre-wrap; word-break:break-all; }
    .note { font-size:12px; color:var(--ink-2); line-height:1.5; margin:0; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>图片插件 · DSH 协作宿主</h1>
    <span class="tag">真实 DSH 插件路由 · 工具由模型会话调用</span>
  </header>
  <main>
    <div class="stage"><iframe id="editor" src="index.html" title="miniPaint 图片编辑器"></iframe></div>
    <aside>
      <section class="panel">
        <h2>连接</h2>
        <div class="row"><button class="primary" id="connect">连接编辑器</button><button id="reconnect">重新连接</button><button id="read">读取状态</button></div>
        <p class="status" id="status">未连接。连接后本页把这个编辑器绑定到 <code>image</code> relay。</p>
      </section>
      <section class="panel">
        <h2>编辑器回读</h2>
        <pre id="output">尚未读取。</pre>
      </section>
      <section class="panel">
        <h2>边界</h2>
        <p class="note">本页只做两件事：从 <code>/media/boot</code> 取同源令牌，把编辑器通过 MessageChannel 绑定到 <code>/media/image-relay</code>。工具调用发生在模型会话里（<code>media_image_*</code>），页面不直连工具、不写工程文件。图片导出应答尚未在页面实现，导出能力为未验证。</p>
      </section>
    </aside>
  </main>
  <script type="module" src="host.js"></script>
</body>
</html>
